<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to the Smart Matatu System.">
    <title>Login | Smart Matatu</title>

    <link rel="stylesheet" href="../css/style.css">

    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <a href="../index.html" class="auth-brand">
                SMART <span>MATATU</span>
            </a>

            <div class="auth-heading">
                <h1>Welcome back</h1>
                <p>Sign in to access your Smart Matatu account.</p>
            </div>

            <div
                id="login-message"
                class="auth-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <form id="login-form" autocomplete="on">

                <div class="form-group">
                    <label for="login-username">Username</label>

                    <input
                        type="text"
                        id="login-username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="login-role">Account Role</label>

                    <select
                        id="login-role"
                        name="role"
                        required
                    >
                        <option value="" selected disabled>
                            Select your account role
                        </option>

                        <option value="admin">
                            Administrator
                        </option>

                        <option value="sacco_manager">
                            SACCO Manager
                        </option>

                        <option value="conductor">
                            Conductor
                        </option>
                    </select>
                </div>

                <div class="auth-options">
                    <a href="forgot-password.html">
                        Forgot password?
                    </a>
                </div>

                <button
                    type="submit"
                    id="login-submit"
                    class="btn btn-primary auth-submit"
                >
                    Sign In
                </button>

            </form>

            <div class="auth-divider">
                <span>New to Smart Matatu?</span>
            </div>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <a href="../index.html" class="back-home">
                &larr; Back to homepage
            </a>

        </section>

    </main>

</body>
</html>
