<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Reset your Smart Matatu account password."
    >

    <title>Reset Password | Smart Matatu</title>

    <link rel="stylesheet" href="../css/style.css">

    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <a href="../index.html" class="auth-brand">
                SMART <span>MATATU</span>
            </a>

            <div class="auth-heading">

                <h1>Create a new password</h1>

                <p>
                    Enter your new password below to regain access
                    to your Smart Matatu account.
                </p>

            </div>

            <div
                id="reset-password-message"
                class="auth-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <form id="reset-password-form" autocomplete="on">

                <div class="form-group">

                    <label for="reset-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="reset-password"
                        name="password"
                        placeholder="Enter your new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <small>
                        Use at least 8 characters.
                    </small>

                </div>

                <div class="form-group">

                    <label for="reset-confirm-password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="reset-confirm-password"
                        name="confirmPassword"
                        placeholder="Confirm your new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="reset-password-submit"
                    class="btn btn-primary auth-submit"
                >
                    Reset Password
                </button>

            </form>

            <p class="auth-footer">
                Remembered your password?
                <a href="login.html">Return to login</a>
            </p>

            <a href="../index.html" class="back-home">
                &larr; Back to homepage
            </a>

        </section>

    </main>

</body>

</html>
