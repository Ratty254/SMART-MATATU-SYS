\</head>

\<body class="auth-page">

<main class="auth-container">

    <section class="auth-card">

        <a href="../index.html" class="auth-brand">
            SMART <span>MATATU</span>
        </a>

        <div class="auth-heading">

            <h1>Forgot your password?</h1>

            <p>
                No worries. Enter the email address associated
                with your account and we'll help you reset it.
            </p>

        </div>

        <div
            id="forgot-password-message"
            class="auth-message"
            role="alert"
            aria-live="polite"
            hidden
        ></div>

        <form id="forgot-password-form" autocomplete="on">

            <div class="form-group">

                <label for="forgot-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="forgot-email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>

            <button
                type="submit"
                id="forgot-password-submit"
                class="btn btn-primary auth-submit"
            >
                Send Reset Link
            </button>

        </form>

        <p class="auth-footer">
            Remembered your password?
            <a href="login.html">Return to login</a>
        </p>

        <a href="../index.html" class="back-home">
            &larr; Back to homepage
        </a>

    </section>

</main>


</body>

</html>
